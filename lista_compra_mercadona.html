<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de la compra · Mercadona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#F5F0E8;
    --crema-alt:#EFE8DC;
    --marron:#3D2B1F;
    --marron-suave:#6B5544;
    --gold:#C4A882;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--marron);
    font-family:'Jost', sans-serif;
    padding:28px 18px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{margin-bottom:22px;}
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{
    font-size:13px;
    color:var(--marron-suave);
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin:18px 0 20px;
    flex-wrap:wrap;
  }
  .toolbar button{
    border:1px solid var(--gold);
    background:transparent;
    color:var(--marron);
    font-family:'Jost',sans-serif;
    font-size:13px;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .toolbar button.active{
    background:var(--marron);
    color:var(--crema);
    border-color:var(--marron);
  }

  form.add{
    background:var(--white);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:24px;
  }
  form.add input, form.add select{
    font-family:'Jost',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid #ddd2c2;
    border-radius:6px;
    background:var(--crema);
    color:var(--marron);
  }
  form.add input::placeholder{color:#a99783;}
  form.add .full{grid-column:1 / -1;}
  form.add button{
    grid-column:1 / -1;
    background:var(--marron);
    color:var(--crema);
    border:none;
    border-radius:6px;
    padding:10px;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
  }

  .cat-block{margin-bottom:22px;}
  .cat-title{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--marron);
    border-bottom:1.5px solid var(--gold);
    padding-bottom:5px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .cat-title span.count{
    font-family:'Jost',sans-serif;
    font-style:normal;
    font-size:12px;
    color:var(--marron-suave);
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--white);
    border-radius:7px;
    padding:9px 12px;
    margin-bottom:6px;
    font-size:14px;
  }
  .item:nth-child(even){background:var(--crema-alt);}
  .item input[type="checkbox"]{
    width:17px;height:17px;accent-color:var(--marron);flex-shrink:0;
  }
  .item .name{flex:1;}
  .item .name .fmt{color:var(--marron-suave);font-size:12px;display:block;}
  .item .price{font-size:13px;color:var(--marron-suave);white-space:nowrap;}
  .item .del{
    background:none;border:none;color:#b08968;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;
  }

  .empty{
    text-align:center;
    color:var(--marron-suave);
    font-size:13px;
    padding:20px 0;
  }

  .paciente-mode .price, .paciente-mode .del, .paciente-mode form.add, .paciente-mode .toolbar{display:none;}
  .paciente-mode .item{background:var(--white);}
  .paciente-mode h1::after{content:" — lista de la compra";}

  footer{
    text-align:center;
    font-size:11px;
    color:var(--gold);
    margin-top:30px;
    letter-spacing:0.5px;
  }

  @media print{
    .toolbar, form.add{display:none;}
    body{background:white;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lista de la compra</h1>
    <div class="sub">Catalogada por Esti · productos reales de Mercadona</div>
  </header>

  <div class="toolbar">
    <button id="modeToggle">Vista paciente</button>
    <button id="printBtn">Imprimir / PDF</button>
    <button id="clearChecks">Desmarcar todo</button>
  </div>

  <form class="add" id="addForm">
    <input type="text" id="fName" placeholder="Nombre del producto" required>
    <select id="fCat" required></select>
    <input type="text" id="fFmt" placeholder="Formato (ej. 1 pack, 200g)">
    <input type="text" id="fPrice" placeholder="Precio (ej. 2,55 €)">
    <button type="submit" class="full">+ Añadir producto</button>
  </form>

  <div id="lists"></div>

  <div class="empty" id="emptyMsg" style="display:none;">Aún no hay productos. Empieza a añadir lo que vayas fotografiando en Mercadona.</div>

  <footer>@nutricion.estigil</footer>
</div>

<script>
const CATEGORIES = [
  "Proteínas",
  "Hidratos de carbono",
  "Grasas",
  "Verdura y ensalada",
  "Fruta",
  "Lácteos y sustitutos",
  "Congelados",
  "Snacks y básicos",
  "Bebidas y extras"
];

const catSelect = document.getElementById('fCat');
CATEGORIES.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  catSelect.appendChild(o);
});

let items = [];
const STORAGE_KEY = 'mercadona-lista-items';

function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
  }catch(e){
    items = [];
  }
  render();
}

function saveItems(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function render(){
  const container = document.getElementById('lists');
  container.innerHTML = '';
  const empty = document.getElementById('emptyMsg');
  empty.style.display = items.length === 0 ? 'block' : 'none';

  CATEGORIES.forEach(cat => {
    const catItems = items.filter(i => i.cat === cat);
    if(catItems.length === 0) return;

    const block = document.createElement('div');
    block.className = 'cat-block';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerHTML = `${cat} <span class="count">${catItems.length}</span>`;
    block.appendChild(title);

    catItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <input type="checkbox" ${item.checked ? 'checked' : ''} data-id="${item.id}">
        <div class="name">${item.name}${item.fmt ? `<span class="fmt">${item.fmt}</span>` : ''}</div>
        <div class="price">${item.price || ''}</div>
        <button class="del" data-id="${item.id}">✕</button>
      `;
      block.appendChild(row);
    });
    container.appendChild(block);
  });

  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = e.target.dataset.id;
      const it = items.find(i => i.id === id);
      if(it){ it.checked = e.target.checked; saveItems(); }
    });
  });
  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = e.target.dataset.id;
      items = items.filter(i => i.id !== id);
      saveItems(); render();
    });
  });
}

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('fName').value.trim();
  const cat = document.getElementById('fCat').value;
  const fmt = document.getElementById('fFmt').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  if(!name) return;
  items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, cat, fmt, price, checked:false });
  saveItems(); render();
  e.target.reset();
  document.getElementById('fName').focus();
});

document.getElementById('modeToggle').addEventListener('click', () => {
  document.body.classList.toggle('paciente-mode');
  const btn = document.getElementById('modeToggle');
  btn.textContent = document.body.classList.contains('paciente-mode') ? 'Vista edición' : 'Vista paciente';
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('clearChecks').addEventListener('click', () => {
  items.forEach(i => i.checked = false);
  saveItems(); render();
});

loadItems();
</script>
</body>
</html>
